<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario Pyme</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2 class="mb-4">📦 Mi Gestión de Inventario</h2>

    <div class="card card-body mb-4 shadow-sm">
        <form action="/agregar" method="POST" class="row g-3">
            <div class="col-md-4">
                <input type="text" name="nombre" class="form-control" placeholder="Producto" required>
            </div>
            <div class="col-md-3">
                <input type="number" name="cantidad" class="form-control" placeholder="Cantidad" required>
            </div>
           <div class="col-md-3">
                <input type="number" name="stock_minimo" class="form-control" placeholder="Mínimo" required>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-success w-100">Añadir</button>
            </div>
        </form>
    </div>

    <table class="table table-hover border">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Stock</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for p in productos %}
            <tr>
                <td>{{ p.nombre }}</td>
                <td>{{ p.cantidad }}</td>
                <td>
                    {% if p.cantidad <= p.stock_minimo %}
                        <span class="badge bg-danger">Bajo Stock</span>
                    {% else %}
                        <span class="badge bg-primary">Ok</span>
                    {% endif %}
                </td>
                <td>
                    <a href="/editar/{{ p.id }}" class="btn btn-sm btn-warning">Editar</a>
                    <a href="/eliminar/{{ p.id }}" class="btn btn-sm btn-danger">Borrar</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
