<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario Pyme</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">        
</head>
<body class="container mt-5">
    <h2 class="mb-4">📦 Mi Gestión de Inventario</h2>
     <div class="navbar-custom d-flex justify-content-between align-items-center">
        <h2 class="m-0"><i class="fas fa-boxes"></i> StockPro</h2>
        <a href="/exportar" class="btn btn-exportar">
            <i class="fas fa-file-excel"></i> Exportar Reporte
        </a>
    </div>

<div class="container">
    </div>
    <div class="card card-body mb-4 shadow-sm">
        <form action="/agregar" method="POST" class="row g-3">
            <div class="col-md-4">
                <input type="text" name="nombre" class="form-control" placeholder="Producto" required>
            </div>
            <div class="col-md-3">
                <input type="number" name="cantidad" class="form-control" placeholder="Cantidad" required>
            </div>
           <div class="col-md-3">
                <input type="number" name="stock_minimo" class="form-control" placeholder="Mínimo" required>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-success w-100">Añadir</button>
            </div>
        </form>
    </div>
    <div class="mb-3">
        <input type="text" id="buscador" class="form-control" placeholder="🔍 Buscar producto por nombre...">
    </div>
    <table class="table table-hover border">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Stock</th>
                <th>Estado</th>
                <th>Fecha</th> <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for p in productos %}
            <tr>
                <td>{{ p.nombre }}</td>
                <td>{{ p.cantidad }}</td>
                <td>
                    {% if p.cantidad <= p.stock_minimo %}
                        <span class="badge bg-danger">Bajo Stock</span>
                    {% else %}
                        <span class="badge bg-primary">Ok</span>
                    {% endif %}
                </td>
                <td>{{ p.fecha }}</td> <td>
                    <a href="/editar/{{ p.id }}" class="btn btn-sm btn-warning">Editar</a>
                    <a href="/eliminar/{{ p.id }}" class="btn btn-sm btn-danger">Borrar</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <script>
    document.getElementById('buscador').addEventListener('keyup', function() {
        let filtro = this.value.toLowerCase();
        let filas = document.querySelectorAll('tbody tr');

        filas.forEach(fila => {
            let nombreProducto = fila.querySelector('td').textContent.toLowerCase();
            if (nombreProducto.includes(filtro)) {
                fila.style.display = '';
            } else {
                fila.style.display = 'none';
            }
        });
    });
</script>
</body>
</html>
