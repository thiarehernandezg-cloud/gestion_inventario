<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
  <div class="contenedor-edicion row justify-content-center">
    <div class="col-md-6">
        <div class="tarjeta-formulario shadow p-4 bg-white rounded">
            <h4 class="mb-4 text-primary">Editar Stock: {{ producto.nombre }}</h4>
            
            <form action="/editar/{{ producto.id }}" method="POST">
                <div class="grupo-entrada mb-3">
                    <label for="cantidad" class="form-label fw-bold">Cantidad Disponible</label>
                    <input type="number" name="cantidad" id="cantidad" class="form-control" 
                           value="{{ producto.cantidad }}" required>
                </div>

                <div class="grupo-entrada mb-3">
                    <label for="stock_minimo" class="form-label fw-bold">Alerta de Stock Mínimo</label>
                    <input type="number" name="stock_minimo" id="stock_minimo" class="form-control" 
                           value="{{ producto.stock_minimo }}" required>
                </div>

                <div class="acciones-formulario d-flex gap-2">
                    <button type="submit" class="btn btn-primary w-100">Guardar Cambios</button>
                    <a href="/" class="btn btn-secondary w-100">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
  </div>
</body>
</html>
