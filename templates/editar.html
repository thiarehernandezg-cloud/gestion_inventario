<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-warning text-dark">
                    <h4>Editar Producto: {{ producto.nombre }}</h4>
                </div>
                <div class="card-body">
                    <form action="/editar/{{ producto.id }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Nueva Cantidad</label>
                            <input type="number" name="cantidad" class="form-control" value="{{ producto.cantidad }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Stock Mínimo</label>
                            <input type="number" name="stock_minimo" class="form-control" value="{{ producto.stock_minimo }}" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Actualizar Cambios</button>
                        <a href="/" class="btn btn-secondary">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
