<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - StockPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-lg border-0 rounded-4 p-4">
                    <div class="text-center mb-4">
                        <i class="fas fa-user-plus fa-3x text-success mb-2"></i>
                        <h3 class="fw-bold">Crear Cuenta</h3>
                        <p class="text-muted">Regístrate para gestionar tu inventario</p>
                    </div>

                    {% with messages = get_flashed_messages() %}
                      {% if messages %}
                        {% for message in messages %}
                          <div class="alert alert-danger p-2 small text-center">{{ message }}</div>
                        {% endfor %}
                      {% endif %}
                    {% endwith %}

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Nombre de Usuario</label>
                            <input type="text" name="username" class="form-control rounded-pill px-3" placeholder="Ej: admin_thiar" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Contraseña</label>
                            <input type="password" name="password" class="form-control rounded-pill px-3" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 rounded-pill fw-bold shadow-sm">
                            Registrarse
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="small text-muted">¿Ya tienes cuenta? <a href="/login" class="text-primary fw-bold text-decoration-none">Inicia Sesión</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
